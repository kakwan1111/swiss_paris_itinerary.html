name: Build iPhone Duo Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'iphone-duo-monitor/**'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iphone-duo-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build EXE
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneDuoMonitor-Windows
          path: iphone-duo-monitor/release/iPhoneDuoMonitor-Windows.zip
          if-no-files-found: error
